# Las pruebas del server en cada PR y en cada push a develop / main. Sin el juego: lo que se puede
# probar en Linux (el server, el relay, el conteo de piezas, la imagen de Docker).
# Un PR con una prueba en rojo no se tendría que fusionar (ver CONTRIBUIR.md).
name: pruebas

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  privado:
    # ★ que no entre nada privado (nombre, correo, IP del VPS o de una casa, MAC, rutas de usuario).
    #   Compara HUELLAS: el valor no está escrito en el repo (herramientas/revisar_publico.py)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python herramientas/revisar_publico.py control
      - run: python herramientas/revisar_publico.py

  server:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pycryptodome==3.24.1"

      - name: el server de juego (cada prueba con su revés; todas, con los XML de datos/)
        run: EDA_EXIGIR_DATOS=1 python servidor/juego.py control

      - name: el relay UDP
        run: python herramientas/relay_udp.py control

      - name: las piezas (mensajes y llamadas, medidas sobre exe/EDA_limpio.exe)
        run: |
          python herramientas/contar_piezas.py control
          python herramientas/contar_piezas.py >> "$GITHUB_STEP_SUMMARY"

      - name: el server por la red contesta (y no contesta con una clave falsa)
        run: |
          EDA_ESTADO="$RUNNER_TEMP/estado" python -m servidor.red > "$RUNNER_TEMP/red.log" 2>&1 &
          sleep 3
          python -m servidor.red prueba 127.0.0.1:25900 || (cat "$RUNNER_TEMP/red.log"; exit 1)

  dll:
    # ★ la d3d9.dll (la parte del cliente que llega a los jugadores) se compila DESDE EL CÓDIGO, con la misma
    #   receta que herramientas/dll_d3d9/compilar.py (Zig 0.16.0). Así un PR que la cambia se puede revisar
    #   leyendo el .c, y nadie necesita el compilador en su PC para saber si compila. El md5 de la compilada y
    #   el de exe/d3d9.dll quedan en el resumen; la compilada, como artefacto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ★ la identidad de la dll usa el último commit de herramientas/dll_d3d9 (version.py)
      - name: Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: compila la d3d9.dll
        run: |
          cd herramientas/dll_d3d9
          python3 version.py --header eda_version.h | tee -a "$GITHUB_STEP_SUMMARY"
          python3 prueba_version.py
          python3 canal.py control
          zig cc -o prueba_selector prueba_selector.c
          ./prueba_selector
          python3 prueba_apis.py
          python3 -c 'import sys, compilar; sys.exit(0 if compilar.control_fuentes() else 1)'
          gcc -std=gnu11 -o /tmp/prueba_apis prueba_apis.c && /tmp/prueba_apis ../../exe/EDA_limpio.exe
          zig cc -target x86-windows-gnu -shared -O2 -s -o d3d9.dll eda_d3d9.c d3d9.def \
            -lkernel32 -luser32 -lwinmm -lws2_32 -liphlpapi -lgdi32
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          md5sum d3d9.dll ../../exe/d3d9.dll | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: d3d9.dll
          path: herramientas/dll_d3d9/d3d9.dll

  cliente-develop:
    # ★ EL CLIENTE DE DEVELOP (19-nov): en cada push a develop, la dll recién compilada (la del trabajo «dll»,
    #   la misma que se revisó), su eda_d3d9.ini y la lista cliente-develop.json quedan en la release
    #   «cliente-develop» de este repositorio. Así quien trabaja en develop prueba contra el server de prueba
    #   (35900) con el cliente que sale de develop, sin tocar main ni el launcher de los jugadores.
    #   Sólo en push a develop: un PR (ni el de un fork) nunca publica. Ver herramientas/dll_d3d9/canal.py
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: dll
    runs-on: ubuntu-latest
    permissions:
      contents: write        # crear la release y mover su etiqueta; el resto de los trabajos sigue en sólo lectura
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: d3d9.dll
          path: salida
      - name: la lista (md5 y sha256 de cada archivo, y la identidad de la dll)
        run: |
          python3 herramientas/dll_d3d9/canal.py armar salida/d3d9.dll salida \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: publica en la release «cliente-develop»
        run: |
          git tag -f cliente-develop "$GITHUB_SHA"
          git push -f origin refs/tags/cliente-develop
          gh release view cliente-develop > /dev/null 2>&1 || gh release create cliente-develop \
            --prerelease --verify-tag --title "Cliente de develop (para probar)" --notes-file salida/notas.md
          # la lista va última: mientras tanto, quien baja ve «no es lo de la lista» y reintenta
          gh release upload cliente-develop salida/d3d9.dll salida/eda_d3d9.ini --clobber
          gh release upload cliente-develop salida/cliente-develop.json --clobber
          gh release edit cliente-develop --prerelease --notes-file salida/notas.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: la imagen se arma (y adentro pasan las pruebas)
        run: docker build -f despliegue/Dockerfile -t eda-server:ci .
