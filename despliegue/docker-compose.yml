# El server de EDA. UN archivo para los dos entornos: cada uno con su .env (ver despliegue/LEEME.md)
#
#   prod   (rama main)    → puerto 25900, relay UDP 26000-26200
#   prueba (rama develop) → puerto 35900, relay UDP 36000-36200
#
#   docker compose -p eda-prod   --env-file /opt/eda/prod.env   -f despliegue/docker-compose.yml up -d --build
#   docker compose -p eda-prueba --env-file /opt/eda/prueba.env -f despliegue/docker-compose.yml up -d --build
services:
  eda:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile
    image: eda-server:${EDA_ENTORNO:-local}
    container_name: eda-${EDA_ENTORNO:-local}
    # ★ la red del VPS tal cual: el relay abre un puerto UDP por jugador, y mapear cientos de
    #   puertos con Docker es lento y frágil. Por eso los puertos se eligen con las variables.
    network_mode: host
    restart: unless-stopped
    environment:
      EDA_PUERTO: ${EDA_PUERTO:-25900}
      EDA_RELAY_IP: ${EDA_RELAY_IP:-}
      EDA_RELAY_BASE: ${EDA_RELAY_BASE:-26000}
      EDA_MAX_CONEXIONES: ${EDA_MAX_CONEXIONES:-200}
      EDA_ANUNCIO: ${EDA_ANUNCIO:-}
      EDA_CLAVES: ${EDA_CLAVES:-}
      EDA_LOGIN: ${EDA_LOGIN:-abierto}
      EDA_PORTERO_CLAVES: ${EDA_PORTERO_CLAVES:-}
      EDA_CUENTAS_CLAVE_PUBLICA: ${EDA_CUENTAS_CLAVE_PUBLICA:-}
      EDA_PREFIJO_CUENTA: ${EDA_PREFIJO_CUENTA:-}
      EDA_CUENTA_NUEVA: ${EDA_CUENTA_NUEVA:-}
      EDA_PORTERO_AUDIENCIA: ${EDA_PORTERO_AUDIENCIA:-}
      EDA_HTTP_PUERTO: ${EDA_HTTP_PUERTO:-}
      # ★ P2P entre casas (servidor/nat.py, MEDICIONES §53): 1 = directo con la pública real; vacío = relay
      EDA_P2P_ENTRE_CASAS: ${EDA_P2P_ENTRE_CASAS:-}
      # ★ (21-nov) el camino de la partida (servidor/config.py): vacío = directo (lo de siempre) · relay · auto.
      #   Antes NO se pasaba al contenedor: poner EDA_P2P en el .env no hacía nada
      EDA_P2P: ${EDA_P2P:-}
      # ★ (21-nov) los diagnósticos de los clientes beta (servidor/diag.py): 1 = POST /eda/diag (SÓLO en prueba) · días y MB
      EDA_DIAG: ${EDA_DIAG:-}
      EDA_DIAG_DIAS: ${EDA_DIAG_DIAS:-}
      EDA_DIAG_MAX_MB: ${EDA_DIAG_MAX_MB:-}
      # ★ (22-nov) cuentas con comandos de GM en el chat (/oro, /nivel, /item…; servidor/config.py): lista separada
      #   por comas; vacía = nadie es GM
      EDA_GM_CUENTAS: ${EDA_GM_CUENTAS:-}
      # ★ el panel del Coordinador Eñeños (servidor/panel.py): la ficha interna (vacía = la puerta no existe), un HTTP
      #   aparte sólo para el panel en la IP de la máquina en la red de Docker (ver despliegue/LEEME.md) y el nombre
      #   del entorno que muestra el panel
      R2_CUENTAS_FICHA_INTERNA: ${R2_CUENTAS_FICHA_INTERNA:-}
      EDA_PANEL_ESCUCHAR: ${EDA_PANEL_ESCUCHAR:-}
      EDA_ENTORNO: ${EDA_ENTORNO:-local}
    volumes:
      # las cuentas de los jugadores: AFUERA del contenedor (y de la copia del repo), para que
      #   sobrevivan a cada actualización y se puedan llevar a otro VPS
      - ${EDA_ESTADO_DIR:-./estado}:/eda/estado
      # (los XML del juego van ADENTRO de la imagen, de datos/ del repo)
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
